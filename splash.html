<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYNAOS — Hyna Studio Management System</title>
  <meta name="description" content="HYNAOS startup splash screen for Hyna Studio Management System.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/splash.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

  <!-- Fullscreen Splash Container -->
  <main class="splash-wrapper" id="splashScreen">
    
    <!-- Background Overlay -->
    <div class="splash-bg"></div>
    <div class="splash-glow"></div>

    <!-- Centered Content Area -->
    <div class="splash-content">
      
      <!-- Hyna Studio Logo -->
      <div class="logo-box">
        <img src="assets/logo/hynaos-logo.jpeg" alt="Hyna Studio Logo" class="splash-logo">
      </div>

      <!-- HYNAOS Branding -->
      <h1 class="splash-title">HYNAOS</h1>
      <p class="splash-subtitle">Hyna Studio Management System</p>
      <p class="splash-tagline">"Run Hyna Studio from one place."</p>

      <!-- Loading Section -->
      <div class="splash-loading-area">
        <span class="loading-text">Loading HYNAOS...</span>
        
        <!-- Animated Loader -->
        <div class="loading-dots">
          <span class="dot dot-1"></span>
          <span class="dot dot-2"></span>
          <span class="dot dot-3"></span>
        </div>
      </div>

    </div>

  </main>

  <!-- Splash Logic Script -->
  <script src="js/splash.js"></script>

</body>
</html>
